[package]
name = "plebfi-github-io"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
leptos = { version = "0.5.1", features = ["csr"] }
gloo-utils = { version = "0.2.0", features = ["serde"] }
